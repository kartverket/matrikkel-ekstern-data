          content:
            application/json:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.Folkeregisterperson'
            application/xml:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.Folkeregisterperson'
          description: Returnerer persondata.
        '400':
          description: Ugyldig parameter.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
        '404':
          description: Ukjent dokumentid.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig part.
        '429':
          description: For mange kall er gjort på kort tid. Vent i minimum antall ms oppgitt i Retry-After header før neste request utføres.
      summary: Henter en arkivert versjon av persondata for en person.
      tags:
        - Offentlig med hjemmel
  /v1/personer/bulkoppslag:
    post:
      operationId: hentPersoner
      parameters:
        - description: Hent ut et utsnitt av personen. Spesifiser hvilke entiteter som skal hentes ut. F.eks. identifikasjonsnummer og identitetsgrunnlag.
          in: query
          name: part
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - description: Henter personer i den rekkefølge de kommer i requestet. Evt. duplikate identifikatorer vil gi duplikate treff. For utgåtte identifikatorer eller identifikatorer som ikke finnes vil man få feilmelding i responsen istedet for persondata.
          in: query
          name: somBestilt
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.bulk.request.PersonBulkoppslagRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.bulk.request.PersonBulkoppslagRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.bulk.response.PersonBulkoppslagResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.bulk.response.PersonBulkoppslagResponse'
          description: Returnerer persondata.
        '400':
          description: Ugyldig parameter.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
