            application/xml:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.bulk.arkiv.response.ArkivPersonDokumentBulkoppslagResponse'
          description: Returnerer persondata.
        '400':
