  /v1/personer/entydigsoek:
    get:
      description: |-
        Minimumskrav til bruk av entydig søk er definert her: https://skatteetaten.github.io/folkeregisteret-api-dokumentasjon/oppslag/
        . Evt. identifiserende adresse må innbefatte minst (adressenavn + husnummer/bokstav) eller (adressenavn + postnummer).  Treffet kan smalnes inn ved å oppgi ytterligere kriterier. Hvis kriteriene til sammen er entydig identifiserende returneres personen. Ved null treff eller mer enn ett treff returneres 404 (NOT FOUND).
      operationId: entydigSoek
      parameters:
        - description: Fødsels- eller d-nummer, 11 siffer. Treffer både gjeldende og historiske opplysninger, uavhengig av parameter 'opplysingsgrunnlag'.
          in: query
          name: identifikasjonsnummer
          schema:
            type: string
        - description: Utenlandsk personidentifikasjon med landkode(ISO-alpha-3)
          example: AFG-1458-4555
          in: query
          name: utenlandskpersonidentifikasjon
          schema:
            type: string
        - description: Legitimasjonsdokument med landkode (ISO alpha-3)
          example: IRL-195509132386
          in: query
          name: legitimasjonsdokument
          schema:
            type: string
        - description: UDIs DUF-nummer
          in: query
          name: utlendingsmyndighetenesidentifikasjonsnummer
          schema:
            type: string
        - description: Fødselsdato (YYYYMMDD)
          example: 19951223
          in: query
          name: foedselsdato
          schema:
            type: string
        - description: 'Minst to delnavn skilt med mellomrom. Første ord må treffe et helt ord fornavnet. Siste ord må treffe et helt ord i etternavnet. Evt. andre ord må treffe hele ord i vilkårlige delnavn.Kan søke fonetisk ved bruk av parameter ''soekfonetisk''. Kan treffe historiske opplysninger ved bruk av parameter ''opplysningsgrunnlag''. '
          in: query
          name: navn
          schema:
            type: string
        - description: 'Postnummer, 4 siffer. Kan treffe historiske opplysninger ved bruk av parameter ''opplysningsgrunnlag''. '
          in: query
          name: postnummer
          schema:
            type: string
        - description: 'Gatenavnet, eller minst 3 tegn fra begynnelsen av det. Kan treffe historiske opplysninger ved bruk av parameter ''opplysningsgrunnlag''. '
          in: query
          name: adressenavn
          schema:
            type: string
        - description: 'Husnummer, med eller uten bokstav. Bokstav eller fravær av den må stemme med personens adresse. Kan treffe historiske opplysninger ved bruk av parameter ''opplysningsgrunnlag''. '
          in: query
          name: husnummer
          schema:
            type: string
        - description: Hvilke opplysninger som skal hentes ut. Flere felter eller aliaser kan oppgis, f.eks. bostedsadresse og navn
          in: query
          name: part
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - description: Fonetisk søk på navn. Default er false. Påvirker ingen andre felter enn navn.
          in: query
          name: soekFonetisk
          schema:
            type: boolean
        - description: '(gjeldende | historisk) Hvorvidt navn og adressefelter skal treffe kun gjeldende eller også historiske opplysninger.Default er ''gjeldende''.For alle andre opplysninger søkes det alltid kun på gjeldende, unntatt identifikasjonsnummer, der det alltid søkes på både gjeldende og historiske opplysninger. '
          in: query
          name: opplysningsgrunnlag
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.Folkeregisterperson'
            application/xml:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.person.v1.Folkeregisterperson'
          description: Returnerer persondata
        '400':
          description: Ugyldig parameter
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
