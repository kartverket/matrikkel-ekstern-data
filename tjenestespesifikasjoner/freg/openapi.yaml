                format: int64
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.Sekvensnummer'
          description: Returnerer siste persisterte sekvensnummer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
      summary: Henter siste persisterte sekvensnummer i feed
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/xsd:
    get:
      operationId: getXsd
      responses:
        default:
          content:
            application/xml: {}
          description: default response
      summary: Hent XSD for hendelse
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/{hendelsesidentifikator}:
    get:
      operationId: hentHendelseDokument
      parameters:
        - description: Identifikator (uuid) for en hendelse
          in: path
