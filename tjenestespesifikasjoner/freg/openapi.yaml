openapi: 3.0.1
info:
  description: |-
    Beskrivelsene under dokumenterer rettighetspakken Offentlig med hjemmel.

    Tilgang til API-et styres med OAuth2-baserte access_tokens.

    Mer informasjon om tjenestene, hvordan du får tilgang og finnes på [folkeregisteret-api-dokumentasjon](https://skatteetaten.github.io/folkeregisteret-api-dokumentasjon/konsumenttjenester/)

    Dokumentasjonen kan foreløpig ikke benyttes til kall mot Folkeregisterets testmiljøer.
  title: Folkeregisteret - offentlig med hjemmel
  version: 1.6.2
paths:
  /v1/hendelser/bulkoppslag:
    post:
      operationId: hentHendelseDokumenter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.hendelse.v1.bulk.request.HendelseBulkoppslagRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.hendelse.v1.bulk.request.HendelseBulkoppslagRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.hendelse.v1.bulk.response.HendelseBulkoppslagResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/folkeregisteret.tilgjengeliggjoering.hendelse.v1.bulk.response.HendelseBulkoppslagResponse'
          description: Returnerer hendelse.
        '400':
          description: Ugyldig input.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
        '429':
          description: For mange kall er gjort på kort tid. Vent i minimum antall ms oppgitt i Retry-After header før neste request utføres.
      summary: Henter et sett med hendelser.
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/feed:
    get:
      operationId: hentFeedSide
      parameters:
        - description: Fra hvilket sekvensnummer (inklusivt) man ønsker å hente registerhendelser.
          in: query
          name: seq
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          content:
            application/atom+xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorer'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorer'
          description: Returnerer en liste med lagrede hendelser
        '304':
          description: Ikke Endret. Innholdet er ikke endret siden ETag versjonen sendt inn i If-None-Match (se https://en.wikipedia.org/wiki/HTTP_ETag#Typical_usage)
        '400':
          description: Ugyldig parameter.
        '401':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
        '404':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
          description: Ikke funnet.
        '429':
          description: For mange kall er gjort på kort tid. Vent i minimum antall ms oppgitt i Retry-After header før neste request utføres.
      summary: Henter lagrede hendelser fra rettighetspakke.
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/feed/tilpasset:
    get:
      operationId: hentTilpassetFeedSide
      parameters:
        - description: Fra hvilket sekvensnummer (inklusivt) man ønsker å hente registerhendelser.
          in: query
          name: seq
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: kommunenummer
          schema:
            type: string
      responses:
        '200':
          content:
            application/atom+xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorerFiltrert'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorerFiltrert'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ske.folkeregister.rettighetspakke.hendelser.LagretHendelseMedDokumentIdentifikatorerFiltrert'
          description: Returnerer en liste med lagrede hendelser filtrert på oppgitt kommune
        '304':
          description: Ikke Endret. Innholdet er ikke endret siden ETag versjonen sendt inn i If-None-Match (se https://en.wikipedia.org/wiki/HTTP_ETag#Typical_usage)
        '400':
          description: Ugyldig parameter.
        '401':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Autentisering feiler.
        '403':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.exception.javaxrs.FolkeregisterFeilmelding'
          description: Ugyldig tilgang.
        '404':
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
            application/json:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
            application/xml:
              schema:
                $ref: '#/components/schemas/ske.folkeregister.lesemodell.universal.feil.ErrorMessageForExternalUsers'
          description: Ikke funnet.
        '429':
          description: For mange kall er gjort på kort tid. Vent i minimum antall ms oppgitt i Retry-After header før neste request utføres.
      summary: Henter lagrede hendelser fra rettighetspakke filtrert på input.
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/feedxsd:
    get:
      operationId: getFeedXsd
      responses:
        default:
          content:
            application/xml: {}
          description: default response
      summary: Hent XSD for feed
      tags:
        - Offentlig med hjemmel
  /v1/hendelser/siste/sekvensnummer:
    get:
      operationId: sisteSekvensnummerIFeed
      responses:
        '200':
          content:
            application/json:
              schema:
