openapi: 3.1.0
info:
  title: Virksomhet TLG API
  description: "<p>Velkommen til vår nye API-dokumentasjon til virksomheter.\_</p>\n\n<p>Her finner du teknisk beskrivelse av våre REST-tjenester.</p>\n\n\n[Read this documentation in English](../en/)\n\n[Se den rå OpenAPI-spesifikasjonen i Swagger UI](./swagger-ui.html)\n\n# Oversikt over tjenester\n\n| Metode | Endepunkt | Beskrivelse |\n|---|---|---|\n| `GET` | [`/api/virksomheter`](#tag/totalbestand/operation/getVirksomheter) | Hent paginert totalbestand |\n| `GET` | [`/api/virksomheter/{organisasjonsnummer}`](#tag/virksomhet/operation/getVirksomhet_2) | Hent data for organisasjonsnummer (krever autentisering) |\n| `GET` | [`/api/public/virksomheter/{organisasjonsnummer}`](#tag/virksomhet/operation/getVirksomhet) | Hent data for organisasjonsnummer (uautentisert, sladdet modell) |\n| `GET` | [`/api/virksomheter/{organisasjonsnummer}/historikk/{dato}`](#tag/historikk/operation/getHistorikkForGittDato) | Henter versjonen av virksomheten slik den ville sett ut på en gitt dato |\n| `GET` | [`/api/virksomheter/{organisasjonsnummer}/endring`](#tag/historikk/operation/getEndringerForParameterGittDato) | Hent endringer for en gitt egenskap fordelt på datoer |\n| `GET` | [`/api/virksomheter/endringslogg`](#tag/historikk/operation/getEndredeVirksomheter) | Hent alle virksomheter som har blitt endret eller opprettet for en gitt periode |\n| `GET` | [`/frivillighetsregisteret/api/frivillige-organisasjoner`](#tag/frivillighetsregisteret/operation/searchFrivillighet) | Søk etter frivillige organisasjoner |\n| `GET` | [`/frivillighetsregisteret/api/frivillige-organisasjoner/{organisasjonsnummer}`](#tag/frivillighetsregisteret/operation/getFrivillighet) | Hent Frivillig organisasjon for organisasjonsnummer |\n| `GET` | [`/frivillighetsregisteret/api/icnpo-kategorier`](#tag/frivillighetsregisteret-icnpo/operation/getIcnpoKategorier) | Hent ICNPO-kategorier |\n| `GET` | [`/frivillighetsregisteret/api/informasjonstyper`](#tag/frivillighetsregisteret-informasjonstyper/operation/getInformasjonstyper) | Hent informasjonstyper |\n\n# Feilhåndtering\n\n<dl>\n  <dt>400 Ugyldig forespørsel</dt>\n  <dd>\n    <p>\n      Hvis en parameter har en ugyldig verdi (f.eks. et organisasjonsnummer som ikke er nøyaktig 9 siffer, eller en filterspørring som ikke lar seg tolke), får du en respons med statuskode 400. Svaret er som regel et JSON-objekt på <code>application/problem+json</code>-format (RFC 7807):\n    </p>\n    <pre><code>\nHTTP/1.1 400 Bad Request\nContent-Type: application/problem+json\n\n{\n  \"status\": 400,\n  \"detail\": \"Bad Request: Invalid organisasjonsnummer\",\n  \"id\": \"b6e1e2b0-df3e-4d0a-9c1a-6f9a2f0a1b2c\"\n}\n    </code></pre>\n    <p>\n      Enkelte parametervalideringer (f.eks. et ugyldig format på et sti-parameter) kan i stedet gi et enklere svar der feltnavn er nøkkel og feilmelding er verdi.\n    </p>\n  </dd>\n  <dt>404 Ikke funnet</dt>\n  <dd>\n    <p>\n      Hvis du gjør oppslag på et organisasjonsnummer som ikke finnes, får du en respons med statuskode 404. De fleste endepunktene gir et svar uten innhold. [Hent Frivillig organisasjon for organisasjonsnummer](#tag/frivillighetsregisteret/operation/getFrivillighet) er unntaket — der får du i tillegg et enkelt JSON-objekt med <code>status</code> og <code>message</code>.\n    </p>\n  </dd>\n  <dt>500 Feil på server</dt>\n  <dd>\n    <p>\n      Ved en uventet feil får du en respons med statuskode 500 og en <code>id</code> (en UUID) i responsen. Ta gjerne kontakt med oss hvis feilen vedvarer, og ta med denne <code>id</code>-en — den gjør at vi lettere kan finne loggene fra forespørselen som feilet.\n    </p>\n  </dd>\n</dl>\n\n# Versjonering\n\nAlle endepunktene støtter versjonering via HTTP-headeren <code>X-API-Version</code>. I dag finnes det bare én versjon, <code>1.0.0</code>, som også er standardverdien hvis du ikke sender headeren selv.\n\nHvis vi på et senere tidspunkt må gjøre en endring som bryter bakoverkompatibiliteten, vil vi innføre en ny versjon og fortsette å tilby <code>1.0.0</code> parallelt en periode, slik at eksisterende integrasjoner ikke stopper å virke uten varsel.\n\n# Paginering\n\n<code>[Hent paginert totalbestand](#tag/totalbestand/operation/getVirksomheter)</code> og <code>[Hent filtrert totalbestand for reginfo med paginering](#tag/totalbestand/operation/getVirksomheterWithFilters)</code> er paginert med <code>page</code> (sidenummer, fra 0) og <code>size</code> (sidestørrelse). For <code>getVirksomheter</code> er standard sidestørrelse 100, og den kan ikke overskride 1000. <code>getVirksomheterWithFilters</code> har ingen slik øvre grense satt i APIet og bruker Spring sin standard sidestørrelse (20) hvis <code>size</code> ikke oppgis.\n\nSvaret er en <code>PagedModelVirksomhetV1</code>, som i tillegg til virksomhetene selv inneholder sidemetadata (`totalElements`, `totalPages`, `number`) og HAL-navigasjonslenker (`first`/`prev`/`self`/`next`/`last`).\n\n[Søk etter frivillige organisasjoner](#tag/frivillighetsregisteret/operation/searchFrivillighet) bruker i stedet cursor-basert paginering med <code>searchAfter</code>: sett denne til organisasjonsnummeret til siste organisasjon du fikk i forrige side, og hent neste bolk. Svaret har en <code>next</code>-lenke så lenge antallet organisasjoner i responsen er likt <code>size</code>-parameteret.\n\n# Holde en lokal kopi synkronisert\n\nSkal du holde en egen kopi av totalbestanden oppdatert uten å hente alt på nytt hver gang, er mønsteret:\n\n1. **Full nedlasting** — hent hele totalbestanden side for side via [Hent paginert totalbestand](#tag/totalbestand/operation/getVirksomheter) (eller [med filter](#tag/totalbestand/operation/getVirksomheterWithFilters) hvis du bare trenger et utvalg).\n2. **Endringsstrøm** — poll deretter [Hent alle virksomheter som har blitt endret eller opprettet for en gitt periode](#tag/historikk/operation/getEndredeVirksomheter) med jevne mellomrom for å få organisasjonsnumrene til det som er endret siden forrige nedlasting.\n3. **Punktoppslag** — for hvert organisasjonsnummer som kommer tilbake i endringsstrømmen, hent den oppdaterte virksomheten på nytt (f.eks. via [Hent data for organisasjonsnummer](#tag/virksomhet/operation/getVirksomhet_2)), eller se nøyaktig hvilke felt som endret seg med [Hent endringer for en gitt egenskap fordelt på datoer](#tag/historikk/operation/getEndringerForParameterGittDato).\n\n⚠️ Steg 2 og 3 krever et Keycloak-utstedt token (scope <code>virksomhet-registerinfo</code>), mens steg 1 kan gjøres med et Maskinporten-utstedt token (scope <code>brreg:virksomhet.read</code>) alene. En integrasjon som bare har Maskinporten-tilgang kan gjenta full nedlasting periodisk, men har ikke tilgang til endringsstrømmen i steg 2/3 — den er forbeholdt konsumenter med Keycloak-tilgang.\n\n# Endringslogg\n\n<dl>\n<dt>21. juli 2026</dt>\n<dd>\n\nEndringsloggen er innført. Fremtidige endringer i APIet legges til her, med dato, hvilke endepunkt som er påvirket og hva som er endret.\n\n</dd>\n</dl>\n"
  version: api-1.0.0-SNAPSHOT
  x-logo:
    url: https://scf.brreg.no/bilder/brreg_logo.svg
servers:
  - url: https://virksomhet-tlg-api.app-ppe.brreg.no
    description: Server
security: []
tags:
  - name: virksomhet
    x-displayName: Hent virksomhet på organisasjonsnummer
    description: "<p>Hent virksomhet på organisasjonsnummer\_</p>\n\n<p>Tjenesten gir informasjon i sanntid om registrerte virksomheter.\_</p>\n\n<p>Dersom virksomheten er slettet vises kun \"virksomhetsstatus\" og slettedato i feltet\_ \"gyldigFraOgMed\".</p>\n"
  - name: totalbestand
    x-displayName: Hent totalbestand
    description: "<p>Totalbestand gir en oversikt over alle innførte virksomheter i Enhetsregisteret. Den inneholder også informasjon om virksomheter som er registrert i Foretaksregisteret og Frivillighetsregisteret. Virksomheter som er slettet i Enhetsregisteret er ikke med i totalbestand.\_</p>\n\n<p>Totalbestand er i JSON-format, og oppdateres daglig mellom kl xx og xx.</p>\n\n<p>Tjenesten inneholder fødselsnummer, og er derfor kun tilgjengelig for offentlig myndigheter, kredittopplysningsforetak og finansforetak. For tilgang, send en søknad til xxx</p>\n\n<p>Autentisering skjer via maskinporten</p>\n"
  - name: historikk
    x-displayName: Historiske data
    description: "<p>Historiske data\_</p>\n\n<p>Via ulike tjenester kan du hente historiske opplysninger om virksomheter.\_</p>\n\n<p>Tjenestene krever autorisasjon via maskinporten.</p>\n"
  - name: frivillighetsregisteret
    x-displayName: Frivillighetsregisteret
    description: "<p>Frivillighetsregisteret er et register over organisasjoner som driver frivillig virksomhet.</p>\n\n<p>For å bli registrert i Frivillighetsregisteret må virksomheten være registrert i Enhetsregisteret. Informasjon om blant annet navn, adresse og kontaktinformasjon til virksomheten, finnes i Enhetsregisteret.\_</p>\n"
paths:
  /api/virksomheter:
    get:
      tags:
        - totalbestand
      summary: Hent paginert totalbestand
      description: |
        <p>Hent paginert totalbestand (beskrivelse)</p>
      operationId: getVirksomheter
      security:
        - maskinportenAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 1000
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedModelVirksomhetV1'
  /frivillighetsregisteret/api/informasjonstyper:
    get:
      tags:
        - frivillighetsregisteret
      summary: Hent informasjonstyper
      operationId: getInformasjonstyper
      security: []
      parameters:
        - name: spraak
          in: query
          description: Språk informasjonstyper skal returneres på
          required: false
          schema:
            type: string
            default: NOB
            enum:
              - NOB
              - NNO
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelFrivInformasjonstype'
      description: "<p>Hent alle informasjonstyper som inngår i APIet fra Frivillighetsregisteret.</p>\n\n<p>\_</p>\n"
  /frivillighetsregisteret/api/icnpo-kategorier:
    get:
      tags:
        - frivillighetsregisteret
      summary: Hent ICNPO kategorier
      operationId: getIcnpoKategorier
      security: []
      parameters:
        - name: spraak
          in: query
          description: Språk ICNPO kategori skal returneres på
          required: false
          schema:
            type: string
            default: NOB
            enum:
              - NOB
              - NNO
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelICNPOKategoriKodeverk'
      description: |
        <p>Hent ICNPO kategorier (International Classification of Nonprofit Organizations Kategorier)</p>
  /frivillighetsregisteret/api/frivillige-organisasjoner:
    get:
      tags:
        - frivillighetsregisteret
      summary: Søk etter frivillige organisasjoner
      description: "<p>Dette endepunktet lar deg søke blant alle frivillige organisasjoner.</p>\n\n<p>Her kan du hente en totalbestand med alle frivillige organisasjoner ved hjelp av paginering. Historikk eller slettede frivillige organisasjoner er ikke med i totalbestanden.</p>\n\n<p>Om Paginering:</p>\n\n<p>Av dataintegritet- og ytelseshensyn bruker dette endepunktet \"searchAfter\" fremfor klassisk paginering. Det fungerer slik:</p>\n\n<ul>\n\t<li>Først setter du \"size\" parameteret til ønsket sidestørrelse.</li>\n\t<li>Så gjør du det første API-kallet, dette gir deg den første siden.</li>\n\t<li>For å hente neste side, sett \"searchAfter\" parameteret til det siste/høyeste organisasjonsnummeret du fikk fra den forrige siden.</li>\n\t<li>Hent nye sider helt til du mottar færre objekter enn det \"size\" parameteret tilsier. Da er du på siste side.</li>\n</ul>\n\n<p>Du kan også bruke \"next\" lenken fra API-responsen for å hente neste side. Next lenken er satt så lenge antall organisasjoner i responsen det samme antallet som size-parameteret tilsier.</p>\n"
      operationId: searchFrivillighet
      security: []
      parameters:
        - name: spraak
          in: query
          required: false
          schema:
            type: string
            enum:
              - NOB
              - NNO
        - name: searchAfter
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 100
            minimum: 1
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelAktivFrivilligOrganisasjonResponse'
  /frivillighetsregisteret/api/frivillige-organisasjoner/{organisasjonsnummer}:
    get:
      tags:
        - frivillighetsregisteret
      summary: Hent én frivillig organisasjon med organisasjonsnummer
      description: "<p>Hent informasjon om en frivillig organisasjon fra Frivillighetsregisteret ved oppslag på organisasjonsnummer.</p>\n\n<p>Dersom en virksomhet er slettet fra Frivillighetsregisteret, vises kun status og slettedato.\_</p>\n"
      operationId: getFrivillighet
      security: []
      parameters:
        - name: organisasjonsnummer
          in: path
          required: true
          schema:
            type: string
        - name: spraak
          in: query
          required: false
          schema:
            type: string
            enum:
              - NOB
              - NNO
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AktivFrivilligOrganisasjonResponse'
                  - $ref: '#/components/schemas/SlettetFrivilligOrganisasjonModel'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
  /api/virksomheter/{organisasjonsnummer}/historikk/{dato}:
    get:
      tags:
        - historikk
      summary: Hent informasjon om virksomheten på en gitt dato
      description: |
        <p>Hent informasjon om virksomheten på en gitt dato. Ved oppslag på organisasjonsnummer og en gitt dato vil resultatet vise hva som var registrert på virksomheten på den angitte datoen.</p>
      operationId: getHistorikkForGittDato
      security:
        - keycloakAuth: []
      parameters:
        - name: organisasjonsnummer
          in: path
          required: true
          schema:
            type: string
        - name: dato
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirksomhetV1'
        '404':
          description: Not Found
  /api/virksomheter/{organisasjonsnummer}/endring:
    get:
      tags:
        - historikk
      summary: Hent endringer for en gitt egenskap fordelt på datoer, f.eks alle historiske navn og når de ble endret
      description: |
        <p>Hent endringer for en gitt egenskap fordelt på datoer, f.eks alle historiske navn og når de ble endret (beskrivelse)</p>
      operationId: getEndringerForParameterGittDato
      security:
        - keycloakAuth: []
      parameters:
        - name: organisasjonsnummer
          in: path
          required: true
          schema:
            type: string
        - name: dato
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endretLedd
          in: query
          required: true
          schema:
            type: string
            enum:
              - Navn
              - Versjon
              - Stiftelsesdato
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Endringslogg'
  /api/public/virksomheter/{organisasjonsnummer}:
    get:
      tags:
        - virksomhet
      summary: Hent virksomhet på organisasjonsnummer
      operationId: getVirksomhet
      security: []
      parameters:
        - name: organisasjonsnummer
          in: path
          required: true
          schema:
            type: string
            maxLength: 9
            minLength: 9
            pattern: \d+
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactedVirksomhetV1'
        '404':
          description: Not Found
      description: "<p>Hent virksomhet på organisasjonsnummer.</p>\n\n<p>Åpent API med informasjon om en virksomhet. Informasjonen er i sanntid.\_</p>\n\n<p>Informasjon om rolleinnehavere vil inneholder navn og fødselsdato.\_</p>\n"
  /api/virksomheter/{organisasjonsnummer}:
    get:
      tags:
        - virksomhet
      summary: Hent virksomhet på organisasjonsnummer - krever autorisasjon
      description: "<p>Hent virksomhet på organisasjonsnummer - krever autorisasjon</p>\n\n<p>Tjenesten inneholder fullt fødselsnummer på rolleinnehavere, og krever autorisasjon via maskinporten for å få tilgang.</p>\n\n<p>\_</p>\n"
      operationId: getVirksomhet_2
      security:
        - maskinportenAuth: []
      parameters:
        - name: organisasjonsnummer
          in: path
          required: true
          schema:
            type: string
            maxLength: 9
            minLength: 9
            pattern: \d+
        - name: X-API-Version
          in: header
          schema:
            type: string
            default: 1.0.0
            enum:
              - 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirksomhetV1'
        '404':
          description: Not Found
components:
  securitySchemes:
    maskinportenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Maskinporten-utstedt JWT med scope `brreg:virksomhet.read`.
    keycloakAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-utstedt JWT med scope `virksomhet-registerinfo`.
  schemas:
    OrganisasjonsforminfoV1:
      description: Virksomhetens organisasjonsform. Organisasjonsformen gir retningslinjer for blant annet ansvarsforhold, skatt og hvilke roller virksomheten kan/må registrere.
      type: object
      properties:
        kode:
          type: string
          description: Kode for organisasjonsformen, f.eks. "AS" eller "ENK".
        navn:
          type: string
          description: Organisasjonsformens fulle navn.
        kortnavn:
          type: string
          description: Kortnavn for organisasjonsformen.
    TilstandsstatusV1:
      description: En midlertidig eller pågående tilstand ved virksomheten eller foretaket, f.eks. konkursbehandling eller sletting.
      type: object
      properties:
        tilstandsstatus:
          type: string
          description: Kode for tilstanden virksomheten eller foretaket er i.
          enum:
            - virksomhetstilstandsstatus.underKonkursbehandling
            - virksomhetstilstandsstatus.underSletting
            - foretakstilstandsstatus.underKonkursbehandling
            - foretakstilstandsstatus.meldtAkkord
            - foretakstilstandsstatus.klageUnderBehandlingIForetaksregisteret
            - foretakstilstandsstatus.underRekonstruksjonsforhandling
            - foretakstilstandsstatus.finansforetak
            - ugyldig
        dato:
          type: string
          format: date
          description: Dato tilstanden ble registrert.
    InstitusjonellSektorkodeV1:
      description: Institusjonell sektorkode, SSBs kodeverk som klassifiserer virksomheten etter samfunnsøkonomisk sektor.
      type: object
      properties:
        kode:
          type: string
          description: Kode for den institusjonelle sektoren.
        navn:
          type: string
          description: Sektorkodens fulle navn.
        kortnavn:
          type: string
          description: Kortnavn for sektorkoden.
    NaeringskodeinfoV1:
      description: Næringskode som beskriver virksomhetens aktivitet, etter SSBs standard for næringsgruppering (SN).
      type: object
      properties:
        kode:
          type: string
          description: Næringskoden.
        navn:
          type: string
          description: Beskrivelse av næringen koden representerer.
        rekkefoelge:
          type: integer
          format: int32
          description: Rangering blant flere registrerte næringskoder. Koden med lavest verdi er hovednæringskoden.
        erHjelpeenhetskode:
          type: boolean
          description: Angir om dette er en hjelpeenhetskode, dvs. en næringskode for en enhet som bare yter tjenester internt i konsernet/foretaket.
        datoGyldigFra:
          type: string
          format: date
          description: Dato næringskoden ble registrert fra.
        naeringskodestandard:
          type: string
          description: Hvilken versjon av SSBs standard for næringsgruppering koden er hentet fra.
    AntallAnsatteV1:
      description: Opplysninger om antall ansatte i virksomheten.
      type: object
      properties:
        antall:
          type: integer
          format: int32
          description: Antall registrerte ansatte.
        gjelderFra:
          type: string
          format: date
