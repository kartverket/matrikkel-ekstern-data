apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: matrikkel-brreg-sync
  namespace: matrikkel-main
spec:
  image: "{{image}}"
  port: 8090
  ingresses:
    - matrikkel-brreg-sync.atkv3-prod.kartverket-intern.cloud
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  liveness:
    port: 8090
    path: /internal/isAlive
    initialDelay: 10      # default: 0
    failureThreshold: 6   # default: 3
  readiness:
    port: 8090
    path: /internal/isReady
    initialDelay: 10      # default: 0
    failureThreshold: 6   # default: 3
  prometheus:
    port: 8090
    path: /internal/metrics
    allowAllMetrics: true

  accessPolicy:
    outbound:
      rules:
        - application: matrikkel-kafka-light
#      external:
#        - host: virksomhet-tlg-api.app-ppe.brreg.no
#        - host: maskinporten.no

  azure:
    application:
      enabled: true

#  maskinporten:
#    enabled: true
#    scopes:
#      consumes:
#        - name: "brreg:virksomhet.read"

  env:
    - name: KAFKA_BROKER_URL
      value: "http://matrikkel-kafka-light:8081"
    - name: KAFKA_BROKER_SCOPE
      value: "atkv3-prod:matrikkel-main:matrikkel-kafka-light"
#    - name: BRREG_URL
#      # TODO: riktig url for prod?
#      value: "https://virksomhet-tlg-api.app-ppe.brreg.no"
    - name: VERSION
      value: "{{version}}"
