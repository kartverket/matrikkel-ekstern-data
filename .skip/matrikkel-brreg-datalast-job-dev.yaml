apiVersion: skiperator.kartverket.no/v1beta1
kind: SKIPJob
metadata:
  name: matrikkel-brreg-datalast-job
  namespace: matrikkel-main
spec:
  image: "{{image}}"
  cron:
    schedule: "* * * * *"
    suspend: true # Workaround for å kunne trigge job selv

  job:
    ttlSecondsAfterFinished: 3600
    activeDeadlineSeconds: 7200

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi

  accessPolicy:
    outbound:
      rules:
        - application: matrikkel-kafka-light
      external:
        - host: data.brreg.no

  azure:
    application:
      enabled: true

  env:
    - name: DRY_RUN
      value: "false"
    - name: KAFKA_BROKER_URL
      value: "http://matrikkel-kafka-light:8081"
    - name: KAFKA_BROKER_SCOPE
      value: "atkv3-dev:matrikkel-main:matrikkel-kafka-light"
    - name: BRREG_URL
      value: "https://data.brreg.no"
    - name: VERSION
      value: "{{version}}"
