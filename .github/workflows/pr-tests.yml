name: PR tests

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
