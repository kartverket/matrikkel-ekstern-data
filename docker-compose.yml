services:
  postgres:
    image: postgres:18.3-alpine
    env_file:
      - docker/local-compose.env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  serg-mock:
    build:
      context: .
      dockerfile: apps/serg-mock/Dockerfile
      args:
        GITHUB_USER: ${GITHUB_USER}
        KV_PACKAGES_PAT: ${KV_PACKAGES_PAT}
    env_file:
      - docker/local-compose.env
    ports:
      - "8094:8084"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  serg-sync:
    build:
      context: .
      dockerfile: apps/serg-sync/Dockerfile
    env_file:
      - docker/local-compose.env
    ports:
      - "8090:8090"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      serg-mock:
        condition: service_started
